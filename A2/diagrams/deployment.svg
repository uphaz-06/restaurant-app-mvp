<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Deployment diagram</text>
  <rect x="40" y="80" width="220" height="180" rx="16" fill="#FFF5F5" stroke="#E63946"/>
  <text x="150" y="130" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">Phone</text>
  <text x="150" y="160" text-anchor="middle" font-size="13" font-family="Arial">Expo Go / emulator</text>
  <text x="150" y="186" text-anchor="middle" font-size="13" font-family="Arial">Restaurant App</text>
  <rect x="340" y="80" width="220" height="180" rx="16" fill="#F1FAFF" stroke="#457B9D"/>
  <text x="450" y="130" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">Laptop</text>
  <text x="450" y="160" text-anchor="middle" font-size="13" font-family="Arial">Node.js + Express</text>
  <text x="450" y="186" text-anchor="middle" font-size="13" font-family="Arial">:5000 /api</text>
  <rect x="640" y="80" width="220" height="180" rx="16" fill="#F0FFF4" stroke="#2A9D8F"/>
  <text x="750" y="130" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">Database</text>
  <text x="750" y="160" text-anchor="middle" font-size="13" font-family="Arial">MongoDB Atlas</text>
  <text x="750" y="186" text-anchor="middle" font-size="13" font-family="Arial">restaurant_app</text>
  <line x1="260" y1="170" x2="340" y2="170" stroke="#333" marker-end="url(#arrow)"/>
  <text x="300" y="158" text-anchor="middle" font-size="11" font-family="Arial">HTTP JSON</text>
  <line x1="560" y1="170" x2="640" y2="170" stroke="#333" marker-end="url(#arrow)"/>
  <text x="600" y="158" text-anchor="middle" font-size="11" font-family="Arial">Mongoose</text>
  <text x="450" y="300" text-anchor="middle" font-size="12" font-family="Arial">Same Wi-Fi: phone uses laptop LAN IP. Android emulator uses 10.0.2.2:5000.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
